root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/nodelio-bridge.exe ./cmd/nodelio-bridge"
  bin = "tmp\\nodelio-bridge.exe"
  args_bin = ["serve", "--open=false"]
  delay = 800
  kill_delay = "2s"
  send_interrupt = true
  stop_on_error = true
  poll = true
  poll_interval = 1000
  include_ext = ["go", "html", "js", "css"]
  exclude_dir = ["tmp", "dist", "testdata"]
  exclude_regex = ["_test\\.go"]

[log]
  time = true

[screen]
  clear_on_rebuild = false
  keep_scroll = true
